[package]
name = "rf-lab-vio-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
nalgebra = "0.33"
visloc-wasm = { path = "../wasm" }
visloc-basalt = { path = "../../../pipelines/basalt" }
visloc-core = { path = "../../../crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
panic = "abort"

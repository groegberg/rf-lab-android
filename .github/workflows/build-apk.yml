name: Build RF Lab APK

on:
  push:
    branches: [main, feature/mobile-rgbd-v0.6, feature/ondevice-surface-v0.7, feature/mobile-quality-ui-v0.8, feature/depth-methods-v0.9, feature/camera2-capture-v1.0, fix/android-systembar-insets-v1.0.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test RF fingerprint localization
        run: gradle --stacktrace --no-daemon :app:testDebugUnitTest
      - name: Test Alexa message contract
        run: node integrations/alexa/messageFactory.test.mjs
      - name: Build debug APK
        run: gradle --stacktrace --no-daemon :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RF-Lab-Pixel10-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

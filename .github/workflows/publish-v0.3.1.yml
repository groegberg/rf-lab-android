name: Publish RF Lab v0.3.1 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and package
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RF-Lab-Field-Studio-v0.3.1.apk
          sha256sum RF-Lab-Field-Studio-v0.3.1.apk
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.1 already exists, leaving it unchanged."
            exit 0
          fi
          gh release create v0.3.1 RF-Lab-Field-Studio-v0.3.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RF Lab Field Studio v0.3.1 — Low-light & Manual Maps" \
            --notes "Android debug APK. New: camera-free user-calibrated 2D Wi-Fi map, low-light fallback, pointwise RSSI median, CSV exports, previous JSONL import, data quality status. No root. Private repo; sign in to download. Uninstalling an older build deletes app data; export measurements first."

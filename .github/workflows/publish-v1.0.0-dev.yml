name: Publish RF Lab v1.0.0-dev.1 direct APK

on:
  push:
    branches: [feature/camera2-capture-v1.0]
    paths:
      - '.github/workflows/publish-v1.0.0-dev.yml'

permissions:
  contents: write

jobs:
  direct-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test Android components
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Test Alexa offline message contract
        run: node integrations/alexa/messageFactory.test.mjs
      - name: Build named APK (not ZIP)
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RF-Lab-v1.0.0-dev.1.apk
          sha256sum RF-Lab-v1.0.0-dev.1.apk
      - name: Publish direct downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-dev.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease exists; preserving the already published APK."
            exit 0
          fi
          gh release create v1.0.0-dev.1 RF-Lab-v1.0.0-dev.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "RF Lab v1.0.0-dev.1 — Controlled Camera2 Photography + VIO-Ready Capture" \
            --notes "Experimental mobile app: independent Camera2 manual/auto photo recording with image-feature quality, full IMU logs, camera calibration/timestamps, gallery and actual bundled DA3-Small photo review. Independent global 6DoF SLAM/VIO/loop closure not yet integrated. Contains bundled 55MB AI model. Back up measurements before installing. Keep main v0.5.0 intact. See docs/CAMERA2_VIO_V100.md."

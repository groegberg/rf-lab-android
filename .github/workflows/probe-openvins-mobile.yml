name: Research - OpenVINS Android ARM64 (separate GPLv3 prototype)

# This workflow does NOT modify or publish the proprietary/private RF Lab APK.
# It builds the original GPLv3 OpenVINS Mobile demo as a separately licensed
# experimental reference, so that we can validate an actual MSCKF VIO engine
# and Pixel camera/IMU calibration BEFORE integrating a native backend.

on:
  workflow_dispatch:
  push:
    branches: [experiment/openvins-live-vio-v1.2]
    paths:
      - .github/workflows/probe-openvins-mobile.yml

permissions:
  contents: read

jobs:
  android-openvins:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android platform and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          "$SDKMANAGER" --install "platforms;android-30" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.18.1" "platform-tools"
      - name: Clone pinned GPLv3 OpenVINS Mobile source with VIO core
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch restructure --recurse-submodules \
            https://github.com/goldbattle/open_vins_mobile.git openvins-mobile
          cd openvins-mobile
          test "$(git rev-parse HEAD)" = "f0c465695c67c0eac786f4edf83a68109a6a58a9"
          git submodule update --init --recursive
          test -f app/src/main/cpp/open_vins/ov_msckf/src/core/VioManager.cpp
          test -f LICENSE
          test -f thirdparty/boost/libs/arm64-v8a/libboost_system.so
          test -f thirdparty/opencv/native/libs/arm64-v8a/libopencv_java4.so
          echo "OpenVINS source and license pinned:"
          git submodule status
      - name: Minimal research-only build compatibility adjustments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("openvins-mobile")
          gradle = root/"app/build.gradle"
          s = gradle.read_text()
          # The upstream build tries to adb-push calibration files while
          # assembling. CI has no physical phone and must never fake a
          # successful camera/IMU calibration.
          idx = s.index("// Make syncDeviceFiles run before install and assemble tasks")
          s = s[:idx] + "// CI: install-specific ADB file sync is disabled.\n"
          s = s.replace("abiFilters 'x86', 'x86_64', 'arm64-v8a'", "abiFilters 'arm64-v8a'")
          gradle.write_text(s)
          cmake = root/"app/src/main/cpp/CMakeLists.txt"
          c = cmake.read_text()
          # arm64 NEON is mandatory; Clang rejects -mfpu=neon on AArch64
          a = c.index("if(ANDROID_ABI STREQUAL armeabi-v7a)")
          b = c.index("# Include OpenCV project", a)
          c = c[:a] + "# arm64 NEON is available without -mfpu.\n\n" + c[b:]
          cmake.write_text(c)
          PY
      - name: Bundle calibration templates and apply Pixel-specific research patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p openvins-mobile/app/src/main/assets/vio_config
          cp openvins-mobile/app_device/config/*.yaml openvins-mobile/app/src/main/assets/vio_config/
          python3 research/openvins_pixel_test_patch.py openvins-mobile
          grep -q 'Scoped storage' openvins-mobile/app/src/main/java/com/openvins/android/MainActivity.kt
          grep -q 'OpenVINS TEST' openvins-mobile/app/src/main/res/layout/activity_main.xml
      - name: Build real OpenVINS Mobile VIO demo for ARM64
        working-directory: openvins-mobile
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -x test
      - name: Check actual APK architecture
        shell: bash
        run: |
          set -euxo pipefail
          APK=openvins-mobile/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnative-lib.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libopencv_java4.so'
          sha256sum "$APK"
      - name: Upload separate GPLv3 research APK and notices
        uses: actions/upload-artifact@v4
        with:
          name: OpenVINS-Mobile-Pixel-Research-APK
          path: |
            openvins-mobile/app/build/outputs/apk/debug/app-debug.apk
            openvins-mobile/LICENSE
            openvins-mobile/ReadMe.md
            research/openvins_pixel_test_patch.py
          if-no-files-found: error
          retention-days: 14

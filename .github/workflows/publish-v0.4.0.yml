name: Publish RF Lab Spatial Home v0.4.0 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.4.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test Spatial Home engine
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verify Alexa offline message contract
        run: node integrations/alexa/messageFactory.test.mjs
      - name: Build Android APK
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RF-Lab-Spatial-Home-v0.4.0.apk
          sha256sum RF-Lab-Spatial-Home-v0.4.0.apk
      - name: Publish authenticated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 already exists; leaving published asset unchanged."
            exit 0
          fi
          gh release create v0.4.0 RF-Lab-Spatial-Home-v0.4.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RF Lab Spatial Home v0.4.0" \
            --notes "Root-free Android 12+ experimental build. New HOME/WOHNUNG/EINMESSEN/AUTOMATION/LAB/EXPERTEN UI, persistent home map, RSSI room fingerprinting and conservative proximity preview, simulator-only rules, JSON backup/restore, old manual CSV import, live magnetometer Lab, Alexa message-contract prototype. Does NOT yet control Alexa devices. No Internet permission. Because CI Debug keystores may differ, export data before uninstalling any previous APK."
